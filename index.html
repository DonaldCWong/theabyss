<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ABYSS</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 200vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding-top: 15vh;
        background-color: #555555;
        color: #f7f1f1;
      }
      main {
        text-align: center;
      }
      h1 {
        margin: 0;
        font-family: "Nosifer", cursive;
        font-size: clamp(2.5rem, 10vw, 7rem);
        letter-spacing: 0.1em;
      }
      .subtitle {
        margin-top: 1rem;
        font-size: 1.25rem;
        text-transform: uppercase;
        color: #7c0d0d;
        font-family: "Nosifer", cursive;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>THE ABYSS</h1>
      <p class="subtitle">Scroll if you are ready</p>
    </main>
    <script>
      (function () {
        if ("scrollRestoration" in window.history) {
          window.history.scrollRestoration = "manual";
        }
        window.scrollTo(0, 0);

        const startColor = { r: 85, g: 85, b: 85 }; // neutral gray
        const endColor = { r: 10, g: 0, b: 0 }; // near-black, slightly red-tinted

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function updateBackground() {
          const scrollTop =
            window.pageYOffset || document.documentElement.scrollTop;
          const docHeight =
            document.documentElement.scrollHeight - window.innerHeight || 1;
          const t = Math.min(Math.max(scrollTop / docHeight, 0), 1);

          const r = Math.round(lerp(startColor.r, endColor.r, t));
          const g = Math.round(lerp(startColor.g, endColor.g, t));
          const b = Math.round(lerp(startColor.b, endColor.b, t));

          document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        }

        window.addEventListener("scroll", updateBackground, { passive: true });
        window.addEventListener("resize", updateBackground);
        updateBackground();
      })();
    </script>
  </body>
</html>
