<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE ABYSS</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nosifer&display=swap"
    />
    <link rel="stylesheet" href="./abyss.css" />
  </head>
  <body>
    <main>
      <h1>THE ABYSS</h1>
      <p class="subtitle">Scroll if you are ready</p>
    </main>
    <p class="bottom-message">
      Congrats, you made it to the bottom. Was it all worth it?
    </p>
    <div
      id="abyssOverlay"
      class="overlay"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
    >
      <div class="modal">
        <p id="abyssTitle" class="modal-title">THE ABYSS</p>
        <p id="abyssBody" class="modal-body">
          You can reveal the prompt, or skip it.
        </p>
        <div class="modal-actions">
          <button id="abyssReveal" type="button">Reveal</button>
          <button id="abyssSkip" type="button">Skip</button>
          <button id="abyssContinue" type="button">
            Continue
          </button>
        </div>
      </div>
    </div>
    <div
      id="abyssSkipModal"
      class="skip-modal"
      aria-hidden="true"
    >
      <span id="abyssSkipModalText">Do you think you can just ignore me?</span>
    </div>
    <div
      id="abyssJoeAngry"
      class="joe-angry-overlay"
      aria-hidden="true"
    >
      <img src="./src/assets/joe%20angry.png" alt="" />
    </div>
    <script src="./abyss.js"></script>
  </body>
</html>
